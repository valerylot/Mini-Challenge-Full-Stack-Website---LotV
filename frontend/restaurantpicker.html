<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Picker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="bg-red-300 text-white">
    <header class="md:text-sm lg:text-lg p-5 text-center">
        <nav class="lg:flex gap-4 justify-center">
            <a href="/frontend" class="hover:underline">Home</a> |
            <a href="/frontend/sayhello.html" class="hover:underline">Say Hello</a> |
            <a href="/frontend/adding2numbers.html" class="hover:underline">Adding 2 Numbers</a> |
            <a href="/frontend/comparing2numbers.html" class="hover:underline">Greater than or Less than</a> |
            <a href="/frontend/magic8ball.html" class="hover:underline">Magic 8 Ball</a> |
            <a href="/frontend/restaurantpicker.html" class="hover:underline">Restaurant Picker</a> |
            <a href="/frontend/madlib.html" class="hover:underline">Mad-Lib</a>
        </nav>
    </header>

    <h1 class="text-6xl text-center mx-auto text-shadow-lg">Restaurant Picker</h1>

    <form id="restaurant-form" action="submit" class="text-center p-4">
        <label class="text-3xl" for="restaurant-type">Please enter a number 1-3.<br> 1. Fast Food<br>2. Sit Down Restaurants<br> 3. Coffee & Boba<br></label>
        <input type="number" min="1" max="3" id="restaurant-type" name="restaurant-type" class="w-100 border-3 rounded-md p-1 text-2xl my-4"><br>
        <button type="submit" id="submit-resturant" class="w-100 border-3 rounded-md p-1 text-2xl">Randomly Generate A Restaurant</button>
    </form>

    <p id="restaurant-output" class="text-3xl text-center"></p>

    <script src="./js/app.js"></script>
</body>

</html>
